# The cluster environment of the thesis's final runs: `conda env export -n sound_cat --no-builds` on the SWC
# cluster, 26 November 2026, with sound_categorisation at 2e52ece. Edited in four places so that it rebuilds:
# the `prefix:` line removed; behav_utils pinned to its v1.1.0 git tag (it is not on PyPI); the
# sound-categorisation line removed (install this checkout instead); ssm kept as a comment (below).
# Linux x86-64 only: the conda packages (libgcc, ld_impl_linux-64, ...) and torch's CUDA wheels (nvidia-*,
# triton) have no macOS builds. Each run's environment.txt records the versions of the machine that made it.
#
#   conda env create -f environment.lock.yml
#   conda activate sound_cat
#   pip install -e . --no-deps

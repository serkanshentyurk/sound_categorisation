[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sound-categorisation"
dynamic = ["version"]
description = "PPC causal role in auditory categorisation — project code on top of behav_utils"
requires-python = ">=3.10"
dependencies = [
    "numpy", "pandas", "scipy", "matplotlib", "pyyaml", "joblib>=1.3", "scikit-learn",
    "behav_utils @ git+https://github.com/serkanshentyurk/behav_utils.git@v0.10.0",
]

[project.optional-dependencies]
fit = ["torch", "sbi", "hmmlearn"]
dev = ["pytest", "ruff", "nbmake", "ipykernel", "jupyterlab"]

[project.scripts]
sc-reports         = "sound_categorisation.reports.cli:main"
sc-export-snapshot = "sound_categorisation.cli.export_snapshot:main"
sc-make-synthetic-cohort = "sound_categorisation.cli.make_synthetic_cohort:main"
sc-new-run         = "sound_categorisation.cli.new_run:main"
sc-make-synthetic-run = "sound_categorisation.cli.make_synthetic_run:main"
sc-sbi-train       = "sound_categorisation.cli.sbi_train:main"
sc-sbi-condition   = "sound_categorisation.cli.sbi_condition:main"
sc-sbi-sbc         = "sound_categorisation.cli.sbi_sbc:main"
sc-sbi-check       = "sound_categorisation.cli.sbi_check:main"
sc-validation-tables = "sound_categorisation.cli.validation_tables:main"
sc-grid-search     = "sound_categorisation.cli.grid_search:main"
sc-consensus       = "sound_categorisation.cli.consensus:main"
sc-feature-selection = "sound_categorisation.cli.feature_selection:main"
sc-update          = "sound_categorisation.cli.update:main"
sc-fetch           = "sound_categorisation.cli.fetch:main"
sc-daily-tracker   = "sound_categorisation.cli.daily_tracker:main"

[tool.setuptools.packages.find]
include = ["sound_categorisation*"]

[tool.setuptools.dynamic]
version = {attr = "sound_categorisation.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: the report pipeline end to end on synthetic data (minutes)",
    "fit: needs torch + sbi; skipped where they are not installed",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["sound_categorisation", "tests"]
extend-exclude = ["notebooks", "arpit"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905", "UP006", "UP007", "UP035"]

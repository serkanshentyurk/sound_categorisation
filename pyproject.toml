[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sound-categorisation"
version = "0.3.0"
description = "PPC causal role in auditory categorisation — project code on top of behav_utils"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "pyyaml", "joblib"]

[project.optional-dependencies]
fit = ["torch", "sbi", "ssm", "hmmlearn"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["sound_categorisation*"]

[tool.pytest.ini_options]
testpaths = ["tests", "behav_utils/tests"]
pythonpath = [".", "behav_utils/src"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["sound_categorisation", "scripts", "tests"]
extend-exclude = ["behav_utils", "notebooks", "arpit"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905", "UP006", "UP007", "UP035"]

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e behav_utils/
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check behav_utils/src behav_utils/tests
          ruff check sound_categorisation tests
      - name: Library tests
        run: pytest behav_utils/tests -q
      - name: Entry points resolve
        run: sc-reports --help >/dev/null && sc-run-gs --help >/dev/null && sc-consensus --help >/dev/null
      - name: Project tests (torch-free)
        run: pytest tests -q --ignore=tests/test_amortised.py --ignore=tests/test_simulator.py
      - name: Report pipeline selftest (opto + switches + summary, synthetic)
        run: sc-reports selftest --out /tmp/reports

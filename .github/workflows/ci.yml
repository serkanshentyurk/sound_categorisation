name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e behav_utils/
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check behav_utils/src behav_utils/tests
          ruff check sound_categorisation tests
      - name: Library tests
        run: pytest behav_utils/tests -q
      - name: Entry points resolve
        run: sc-reports --help >/dev/null && sc-run-gs --help >/dev/null && sc-consensus --help >/dev/null
      - name: Project unit tests
        run: pytest tests/unit -q
      - name: Project end-to-end (report pipeline on synthetic data, pinned reference)
        run: pytest tests/e2e -q
      - name: Project fit tests (skip without torch; they skip themselves)
        run: pytest tests/fit -q

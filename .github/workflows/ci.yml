name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"            # pulls behav_utils from its tagged git release
      - name: Lint
        run: ruff check sound_categorisation tests
      - name: Entry points resolve
        run: sc-reports --help >/dev/null && sc-grid-search --help >/dev/null && sc-consensus --help >/dev/null
      - name: Project unit tests
        run: pytest tests/unit -q
      - name: Project end-to-end (report pipeline on synthetic data, pinned reference)
        run: pytest tests/e2e -q
      - name: Project fit tests (skip without torch; exit 5 = nothing collected is fine)
        run: pytest tests/fit -q || [ $? -eq 5 ]
      - name: Synthetic runs for the notebooks
        run: sc-make-synthetic-run --results /tmp/sc_results --data /tmp/sc_data
      - name: Notebooks execute against the synthetic runs
        env:
          SC_NB_SYNTHETIC: "1"
          SC_RESULTS_ROOT: /tmp/sc_results
          SC_DATA_ROOT: /tmp/sc_data
        run: pytest --nbmake notebooks/00_*.ipynb notebooks/1*.ipynb notebooks/2*.ipynb notebooks/31_*.ipynb -q
